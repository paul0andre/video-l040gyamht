<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reel Bastidores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Jost:wght@300;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --marrom:#1D130B; --creme:#F6EEE2; --ouro:#D9B877; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--marrom); color:var(--creme); font-family:"Jost",sans-serif; font-weight:300; }
  main { max-width:460px; margin:0 auto; padding:28px 16px 40px; text-align:center; }
  .fino { font-family:"Cormorant Garamond",serif; font-style:italic; font-size:26px; margin:0; }
  h1 { font-family:"Playfair Display",serif; font-weight:600; font-size:44px; margin:2px 0 6px;
       background:linear-gradient(180deg,#F8EBCB,#E6CB8E 48%,#B08A45); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .fio { width:60px; height:2px; background:var(--ouro); margin:0 auto 22px; }
  video { width:100%; aspect-ratio:9/16; border-radius:14px; background:#000; display:block; box-shadow:0 10px 40px rgba(0,0,0,.45); }
  .btn { display:block; margin:22px 0 10px; padding:17px; border-radius:40px; text-decoration:none; font-weight:500; font-size:17px; letter-spacing:1px;
         color:var(--marrom); background:linear-gradient(180deg,#F8EBCB,#E6CB8E 48%,#B08A45); }
  .btn.sec { background:transparent; color:var(--ouro); border:1px solid var(--ouro); margin-top:0; }
  .dica { font-size:14px; line-height:1.5; opacity:.8; margin-top:18px; }
  .ass { font-size:13px; letter-spacing:2px; color:var(--ouro); margin-top:26px; }
</style>
</head>
<body>
<main>
  <p class="fino">seu reel de</p>
  <h1>Bastidores</h1>
  <div class="fio"></div>
  <video src="bastidores-consultorio.mp4" poster="capa.jpg" controls playsinline preload="metadata"></video>
  <a class="btn" href="bastidores-consultorio.mp4" download="bastidores-consultorio.mp4">Baixar vídeo</a>
  <a class="btn sec" href="#" id="share" hidden>Compartilhar / salvar no celular</a>
  <p class="dica">30 segundos · vertical 1080×1920 · trilha já incluída.<br>
  No iPhone, se o download não começar, toque em <b>Compartilhar / salvar</b> e escolha “Salvar vídeo”.</p>
  <p class="ass">@biabarros.oficial</p>
</main>
<script>
  const b = document.getElementById('share');
  if (navigator.canShare) {
    b.hidden = false;
    b.addEventListener('click', async e => {
      e.preventDefault();
      b.textContent = 'Preparando…';
      try {
        const blob = await (await fetch('bastidores-consultorio.mp4')).blob();
        const f = new File([blob], 'bastidores-consultorio.mp4', { type: 'video/mp4' });
        if (navigator.canShare({ files: [f] })) await navigator.share({ files: [f] });
        else location.href = 'bastidores-consultorio.mp4';
      } catch (err) {}
      b.textContent = 'Compartilhar / salvar no celular';
    });
  }
</script>
</body>
</html>
